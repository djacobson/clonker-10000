<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>The Clonker 10000</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #20242a;
            color: #f0f0f0;
            margin: 0;
            padding: 24px;
        }

        main {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: #e6b85c;
        }

        .panel {
            background: #30363e;
            padding: 20px;
            border-radius: 10px;
        }

        button {
            background: #e6b85c;
            color: #20242a;
            border: none;
            border-radius: 6px;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
        }

        #save-config {
            margin-top: 20px;
        }
 
        .value {
            font-family: monospace;
        }

        .attribution {
            font-size: 10px;
            color: #888;
            margin-top: 4px;
            margin-bottom: 16px;
            text-align: center;
        }

        .attribution a {
            color: inherit;
            text-decoration: underline;
        }

        .device-panel {
            margin-top: 16px;
        }

        .device-panel label {
            display: block;
            margin-bottom: 6px;
        }
 
        .room {
            border-top: 1px solid #555;
            padding-top: 12px;
            margin-top: 20px;
        }

        .room h3 {
            color: #e6b85c;
            margin-bottom: 14px;
        }

        .room label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
        }

        .room input,
        .room select {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #666;
            border-radius: 6px;
            background: #20242a;
            color: #f0f0f0;
            font-size: 15px;
        }

        .room select:disabled {
            opacity: 1;
            -webkit-text-fill-color: #f0f0f0;
        } 

    </style>
</head>

<body>
<main>
    <h1>THE CLONKER 10000</h1>

    <div class="attribution">
      Designed by David Jacobson ·
      <a href="https://github.com/djacobson/clonker-10000"
        target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
 
    <section class="panel">
        <h2>System Clock</h2>

        <p>
            Clock source:
            <span class="value" id="clock-source">
                Not connected
            </span>
        </p>

        <p>
            Current time:
            <span class="value" id="clock-time">
                Not available
            </span>
        </p>

        <button id="sync-clock">
            Synchronize with Browser
        </button>
    </section>


    <section class="panel device-panel">
        <h2>Device Configuration</h2>

        <div id="rooms-container">
            Loading room configuration...
        </div>

        <button id="save-config" disabled>
            Save Configuration
        </button> 
    </section>

</main>


<script>
    const MAX_CONFIG_ATTEMPTS = 5;
    let configAttempts = 0;

    async function loadDeviceConfig() {
        configAttempts++;
 
        const container =
            document.getElementById("rooms-container");

        try {
            const response = await fetch("/api/config", {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const config = await response.json();

            // Sort by numeric room position.
            const roomIds = Object.keys(config.rooms).sort(
                (a, b) => {
                    const aNum = Number(a.split("-")[1]);
                    const bNum = Number(b.split("-")[1]);
                    return aNum - bNum;
                }
            );

            container.replaceChildren();

            for (const roomId of roomIds) {
                const room = config.rooms[roomId];

                const section = document.createElement("div");
                section.className = "room";
                section.dataset.roomId = roomId;

                const heading = document.createElement("h3");
                heading.textContent =
                    roomId.toUpperCase() + " -- " + room.name;
                section.appendChild(heading);

                const fields = [
                    ["Room Name", room.name, "name"],
                    ["TV IP Address", room.tv_ip, "tv_ip"],
                    ["AVR IP Address", room.avr_ip, "avr_ip"]
                ];

                for (const [labelText, value, fieldName] of fields) {
                    const label = document.createElement("label");
                    label.textContent = labelText;

                    const input = document.createElement("input");
                    input.type = "text";
                    input.dataset.field = fieldName;
                    input.value = value;
                    input.readOnly = false;

                    section.appendChild(label);
                    section.appendChild(input);
                }

                // Volume Control uses a fixed-choice dropdown.
                const volumeLabel =
                    document.createElement("label");
                volumeLabel.textContent = "Volume Control";

                const volumeSelect =
                    document.createElement("select");

                for (const [value, text] of [
                    ["tv", "TV"],
                    ["avr", "AVR"]
                ]) {
                    const option =
                        document.createElement("option");
                    option.value = value;
                    option.textContent = text;
                    volumeSelect.appendChild(option);
                }

                volumeSelect.value = room.volume_device;
                volumeSelect.dataset.field = "volume_device";
                volumeSelect.disabled = false;

                section.appendChild(volumeLabel);
                section.appendChild(volumeSelect);

                container.appendChild(section);
            }
        } catch (error) {
            console.warn("Configuration load failed:", error);

            if (configAttempts < MAX_CONFIG_ATTEMPTS) {
                container.textContent =
                    "Loading room configuration...";
                setTimeout(loadDeviceConfig, 1500);
            } else {
                container.textContent =
                    "Unable to load configuration. Refresh the page to retry.";
            }
        }

    }

    function collectDeviceConfig() {
        const rooms = {};

        document.querySelectorAll(".room").forEach(section => {
            const roomId = section.dataset.roomId;
            const room = {};

            section.querySelectorAll("[data-field]").forEach(field => {
                room[field.dataset.field] = field.value.trim();
            });

            rooms[roomId] = room;
        });

        return { rooms };
    }

    async function updateClock() {
        try {
            const response = await fetch("/api/clock", {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const clock = await response.json();

            document.getElementById("clock-source")
                .textContent = clock.source;

            document.getElementById("clock-time")
                .textContent = clock.timestamp;

        } catch (error) {
            console.error("Clock update failed:", error);

            document.getElementById("clock-source")
                .textContent = "Connection error";
        }
    }

    async function synchronizeClock() {
        const button = document.getElementById("sync-clock");
        button.disabled = true;

        try {
            const utc = Math.floor(Date.now() / 1000);

            const response = await fetch(
                "/api/clock?utc=" + utc,
                {
                    method: "POST",
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            await updateClock();

        } catch (error) {
            console.error("Clock sync failed:", error);
            alert("Clock synchronization failed: " + error.message);

        } finally {
            button.disabled = false;
        }
    }

    // Connect the button to its handler.
    document.getElementById("sync-clock")
        .addEventListener("click", synchronizeClock);

    // Read clock status when the page opens.
    updateClock();

    // Read device configuration when the page opens.
    loadDeviceConfig();

    // Refresh the display every 5 seconds.
    setInterval(updateClock, 5000);
</script>

</body>
</html>
