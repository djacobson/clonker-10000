
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>The Clonker 10000</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #20242a;
            color: #f0f0f0;
            margin: 0;
            padding: 24px;
        }

        main {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: #e6b85c;
        }

        .panel {
            background: #30363e;
            padding: 20px;
            border-radius: 10px;
        }

        button {
            background: #e6b85c;
            color: #20242a;
            border: none;
            border-radius: 6px;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
        }

        .value {
            font-family: monospace;
        }

        .attribution {
            font-size: 10px;
            color: #888;
            margin-top: 4px;
            margin-bottom: 16px;
            text-align: center;
        }

        .attribution a {
            color: inherit;
            text-decoration: underline;
        }

        .device-panel {
            margin-top: 16px;
        }

        .device-panel label {
            display: block;
            margin-bottom: 6px;
        }

        .device-panel input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #666;
            border-radius: 6px;
            background: #20242a;
            color: #f0f0f0;
            font-size: 15px;
        }
 
    </style>
</head>

<body>
<main>
    <h1>THE CLONKER 10000</h1>

    <div class="attribution">
      Designed by David Jacobson ·
      <a href="https://github.com/djacobson/clonker-10000"
        target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
 
    <section class="panel">
        <h2>System Clock</h2>

        <p>
            Clock source:
            <span class="value" id="clock-source">
                Not connected
            </span>
        </p>

        <p>
            Current time:
            <span class="value" id="clock-time">
                Not available
            </span>
        </p>

        <button id="sync-clock">
            Synchronize with Browser
        </button>
    </section>

    <section class="panel device-panel">
        <h2>Device Configuration</h2>

        <p>
            <label for="tv-ip">TV IP Address</label>
            <input id="tv-ip" type="text" readonly>
        </p>

        <p>
            <label for="avr-ip">AVR IP Address</label>
            <input id="avr-ip" type="text" readonly>
        </p>

        <p>
            <label for="volume-device">Volume Control</label>
            <input id="volume-device" type="text" readonly>
        </p>
    </section> 
</main>


<script>
    async function loadDeviceConfig() {
        try {
            const response = await fetch("/api/config", {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const config = await response.json();

            document.getElementById("tv-ip").value =
                config.tv_ip;

            document.getElementById("avr-ip").value =
                config.avr_ip;

            document.getElementById("volume-device").value =
                config.volume_device;

        } catch (error) {
            console.error("Configuration load failed:", error);
        }
    }

    async function updateClock() {
        try {
            const response = await fetch("/api/clock", {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const clock = await response.json();

            document.getElementById("clock-source")
                .textContent = clock.source;

            document.getElementById("clock-time")
                .textContent = clock.timestamp;

        } catch (error) {
            console.error("Clock update failed:", error);

            document.getElementById("clock-source")
                .textContent = "Connection error";
        }
    }

    async function synchronizeClock() {
        const button = document.getElementById("sync-clock");
        button.disabled = true;

        try {
            const utc = Math.floor(Date.now() / 1000);

            const response = await fetch(
                "/api/clock?utc=" + utc,
                {
                    method: "POST",
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            await updateClock();

        } catch (error) {
            console.error("Clock sync failed:", error);
            alert("Clock synchronization failed: " + error.message);

        } finally {
            button.disabled = false;
        }
    }

    // Connect the button to its handler.
    document.getElementById("sync-clock")
        .addEventListener("click", synchronizeClock);

    // Read clock status when the page opens.
    updateClock();

    // Read device configuration when the page opens.
    loadDeviceConfig();

    // Refresh the display every 5 seconds.
    setInterval(updateClock, 5000);
</script>

</body>
</html>
